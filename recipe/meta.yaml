{% set name = "jupyter_client" %}
{% set version = "8.10.0" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: 9f7116294dca55f1785be880057d44544db9b1567718d92cb33c58886afb9497

build:
  number: 0
  skip: true  # [py<310]
  script: {{ PYTHON }} -m pip install . --no-deps --no-build-isolation -vv
  entry_points:
    - jupyter-kernel = jupyter_client.kernelapp:main
    - jupyter-kernelspec = jupyter_client.kernelspecapp:KernelSpecApp.launch_instance
    - jupyter-run = jupyter_client.runapp:RunApp.launch_instance

requirements:
  host:
    - pip
    - python
    - hatchling >=1.5
  run:
    - python
    - jupyter_core >=5.1
    - python-dateutil >=2.8.2
    - pyzmq >=25.0
    - tornado >=6.4.1
    - typing_extensions >=4.13.0
    - traitlets >=5.3

{% set deselect_tests = "" %}
# FileNotFoundError: [Errno 2] No such file or directory: '/sbin/ifconfig'
{% set deselect_tests = deselect_tests + " --deselect=tests/test_localinterfaces.py::test_load_ips" %}  # [linux]
# Timeout
{% set deselect_tests = deselect_tests + " --deselect=tests/test_kernelmanager.py::TestParallel::test_start_sequence_kernels[tcp]" %}  # [win]

test:
  source_files:
    - tests
  imports:
    - jupyter_client
    - jupyter_client.asynchronous
    - jupyter_client.blocking
    - jupyter_client.ioloop
    - jupyter_client.provisioning
    - jupyter_client.ssh
  requires:
    - pip
    - pytest
    - pytest-jupyter-client >=0.4.1  # [py<314]
    - pytest-cov
    - pytest-timeout
    # Skip py314 because ipykernel & pytest-jupyter-client are a circular dependency.
    - ipykernel >=6.14  # [py<314]
    - paramiko  # [win]
  commands:
    - pip check
    - pytest tests -vv tests {{ deselect_tests }}  # [py<314]

about:
  home: https://jupyter.org
  license: BSD-3-Clause
  license_family: BSD
  license_file: LICENSE
  summary: Jupyter protocol implementation and client libraries.
  description: |
    jupyter_client contains the reference implementation of the Jupyter protocol. It also provides client and kernel
    management APIs for working with kernels. It also provides the jupyter kernelspec entrypoint for installing
    kernelspecs for use with Jupyter frontends.
  dev_url: https://github.com/jupyter/jupyter_client
  doc_url: https://jupyter-client.readthedocs.io/en/stable/

extra:
  recipe-maintainers:
    - jakirkham
    - minrk
    - pelson
    - ocefpaf
    - carreau
    - SylvainCorlay
    - bollwyvl
    - davidbrochart
