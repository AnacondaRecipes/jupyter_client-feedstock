{% set name = "jupyter_client" %}
{% set version = "8.8.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/jupyter_client-{{ version }}.tar.gz
  sha256: d556811419a4f2d96c869af34e854e3f059b7cc2d6d01a9cd9c85c267691be3e

build:
  number: 0
  skip: true  # [py<310]
  script: {{ PYTHON }} -m pip install . --no-deps --no-build-isolation -vv
  entry_points:
    - jupyter-kernel = jupyter_client.kernelapp:main
    - jupyter-kernelspec = jupyter_client.kernelspecapp:KernelSpecApp.launch_instance
    - jupyter-run = jupyter_client.runapp:RunApp.launch_instance

requirements:
  host:
    - pip
    - python
    - hatchling >=1.5
  run:
    - python
    - importlib_metadata >=4.8.3  # [py<310]
    - jupyter_core >=4.12,!=5.0.*
    - python-dateutil >=2.8.2
    - pyzmq >=25.0
    - tornado >=6.4.1
    - traitlets >=5.3
    - jupyter-core >=5.1

test:
  source_files:
    - tests
  requires:
    # Skip py314 because ipykernel & pytest-jupyter-client are a circular dependency.
    - ipykernel >=6.14  # [py<314]
    - ipython
    - paramiko  # [win]
    - pip
    - pytest <8.2.0
    - pytest-jupyter-client >=0.4.1  # [py<314]
    - pytest-cov
    - pytest-timeout
  imports:
    - jupyter_client
    - jupyter_client.asynchronous
    - jupyter_client.blocking
    - jupyter_client.ioloop
    - jupyter_client.provisioning
    - jupyter_client.ssh

about:
  home: https://jupyter.org
  license: BSD-3-Clause
  license_family: BSD
  license_file: LICENSE
  summary: Jupyter protocol implementation and client libraries.
  description: |
    jupyter_client contains the reference implementation of the Jupyter protocol. It also provides client and kernel
    management APIs for working with kernels. It also provides the jupyter kernelspec entrypoint for installing
    kernelspecs for use with Jupyter frontends.
  dev_url: https://github.com/jupyter/jupyter_client
  doc_url: https://jupyter-client.readthedocs.io

extra:
  recipe-maintainers:
    - jakirkham
    - minrk
    - pelson
    - ocefpaf
    - carreau
    - SylvainCorlay
    - bollwyvl
    - davidbrochart
